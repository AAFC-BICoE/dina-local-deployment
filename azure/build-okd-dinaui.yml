trigger: none

parameters:
- name: versionTag
  displayName: tag to use in Azure Container Registry (ACR)
  type: string
  default: dev
- name: pushACR
  displayName: Push to Azure Container Registry (ACR)
  type: boolean
  default: false
  
name: Build OKD DINA-UI image

pool:
  vmImage: ubuntu-latest

variables:
  imageTagFQP: $(ContainerRegistry).azurecr.io/okd/dina-ui-okd:${{ parameters.versionTag }}
  imageTag: ${{ parameters.versionTag }}
  AZ_SC: $(ServiceConnection)
  AZ_ACR: $(ContainerRegistry)
  
steps:

 - script: |
    set -e
    docker build -f okd/Dockerfile-dinaui -t dina-ui-okd:$(imageTag) .

    docker save dina-ui-okd:$(imageTag) -o $(System.DefaultWorkingDirectory)/image.tar

    docker run --rm \
      -v $(System.DefaultWorkingDirectory):/work \
      aquasec/trivy:0.76.1 image \
      --input /work/image.tar \
      --pkg-types os \
      --severity HIGH,CRITICAL \
      --ignore-unfixed \
      --exit-code 1

    docker tag \
      dina-ui-okd:$(imageTag) \
      $(imageTagFQP)
   displayName: Build and Scan Image
 - task: AzureCLI@2
   displayName: Login and push to Azure Container Registry
   condition: ${{ eq(parameters.pushACR, true) }}
   inputs:
    connectedServiceNameARM: ${{ variables.AZ_SC }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      echo "$(imageTagFQP)"
      az acr login --name ${{ variables.AZ_ACR }}.azurecr.io
      docker image ls
      docker push $(imageTagFQP)
